<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8" />
<title>TimeTaker — Card Deck</title>
<meta name="viewport" content="width=device-width, initial-scale=1" />
<style>
  :root { color-scheme: light; }
  * { box-sizing: border-box; }
  body {
    margin: 0; min-height: 100vh;
    background: #fef9f0;
    font-family: 'Segoe UI', system-ui, sans-serif;
    color: #2a2a2a;
    padding: 28px;
  }
  header { display: flex; align-items: center; justify-content: space-between; flex-wrap: wrap; gap: 10px; margin-bottom: 20px; }
  h1 { margin: 0; font-size: 1.6rem; }
  .status-chip {
    padding: 6px 14px; border-radius: 999px; font-weight: 700; font-size: .85rem;
    background: #ddd; color: #555;
  }
  .status-chip.started { background: #d6f5d6; color: #1a7a1a; }
  .status-chip.stopped, .status-chip.ended { background: #ffe3bf; color: #a65b00; }
  .status-chip.signup { background: #dbe6ff; color: #2a4fbf; }
  .grid {
    display: grid;
    grid-template-columns: repeat(auto-fill, minmax(220px, 1fr));
    gap: 18px;
  }
  .card {
    perspective: 1000px;
    height: 150px;
  }
  .card-inner {
    position: relative; width: 100%; height: 100%;
    transition: transform .5s;
    transform-style: preserve-3d;
    cursor: pointer;
  }
  .card:hover .card-inner, .card.flipped .card-inner { transform: rotateY(180deg); }
  .face {
    position: absolute; inset: 0; backface-visibility: hidden;
    border-radius: 16px; padding: 16px;
    box-shadow: 0 6px 16px rgba(0,0,0,.12);
    display: flex; flex-direction: column; justify-content: space-between;
  }
  .face.front {
    background: linear-gradient(135deg, var(--c1), var(--c2));
    color: #fff;
  }
  .face.back {
    background: #fff; transform: rotateY(180deg);
    border: 2px solid var(--c1);
  }
  .rank-badge {
    align-self: flex-end;
    font-weight: 800; font-size: 1.6rem;
    background: rgba(255,255,255,.25);
    border-radius: 10px; padding: 2px 10px;
  }
  .avatar {
    width: 48px; height: 48px; border-radius: 50%;
    background: rgba(255,255,255,.35);
    display: flex; align-items: center; justify-content: center;
    font-weight: 800; font-size: 1.2rem;
  }
  .pname { font-weight: 800; font-size: 1.15rem; margin-top: 8px; }
  .pheat { font-size: .8rem; opacity: .85; }
  .stat-line { display: flex; justify-content: space-between; font-size: .85rem; color: #555; }
  .stat-line b { color: #222; font-size: 1.05rem; }
  .empty { grid-column: 1 / -1; text-align: center; padding: 60px; color: #999; font-size: 1.1rem; }
  .back-link { display: inline-block; margin-top: 28px; color: #888; text-decoration: none; font-size: .9rem; }
</style>
</head>
<body>
  <header>
    <h1>🃏 TimeTaker — Card Deck</h1>
    <span class="status-chip" id="statusChip">Loading…</span>
  </header>
  <div class="grid" id="grid"></div>
  <a class="back-link" href="index.html">← back to UI concepts</a>

<script>
const grid = document.getElementById('grid');
const statusChip = document.getElementById('statusChip');

const PALETTES = [
  ['#ff6a88', '#ff9a8b'], ['#36d1dc', '#5b86e5'], ['#f7971e', '#ffd200'],
  ['#8e2de2', '#4a00e0'], ['#11998e', '#38ef7d'], ['#fc4a1a', '#f7b733'],
];

function paletteFor(id) {
  return PALETTES[id % PALETTES.length];
}

function initials(name) {
  return name.split(/\s+/).filter(Boolean).slice(0, 2).map((w) => w[0].toUpperCase()).join('') || '?';
}

function fmtDuration(ms) {
  if (ms == null) return '—';
  const s = Math.floor(ms / 1000);
  return `${Math.floor(s / 60)}:${String(s % 60).padStart(2, '0')}`;
}

function escapeHtml(s) {
  return String(s).replace(/[&<>"']/g, (c) => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]));
}

async function tick() {
  try {
    const [state, board] = await Promise.all([
      fetch('/api/state').then((r) => r.json()),
      fetch('/api/leaderboard').then((r) => r.json()),
    ]);

    statusChip.textContent = state.status.toUpperCase();
    statusChip.className = 'status-chip ' + state.status;

    if (board.length === 0) {
      grid.innerHTML = '<div class="empty">No participants signed up yet.</div>';
      return;
    }

    const sorted = [...board].sort((a, b) => b.rounds - a.rounds);
    grid.innerHTML = sorted.map((row, i) => {
      const [c1, c2] = paletteFor(row.id);
      return `
        <div class="card">
          <div class="card-inner">
            <div class="face front" style="--c1:${c1}; --c2:${c2}">
              <div class="rank-badge">#${i + 1}</div>
              <div>
                <div class="avatar">${initials(row.name)}</div>
                <div class="pname">${escapeHtml(row.name)}</div>
                <div class="pheat">${escapeHtml(row.heatName || '')}</div>
              </div>
            </div>
            <div class="face back">
              <div class="stat-line"><span>Laps</span><b>${row.rounds}</b></div>
              <div class="stat-line"><span>Last lap</span><b>${fmtDuration(row.lastLapDurationMs)}</b></div>
              <div class="stat-line"><span>Distance</span><b>${row.distanceMeters ? row.distanceMeters + 'm' : '—'}</b></div>
              <div class="stat-line"><span>Gender</span><b>${escapeHtml(row.gender || '—')}</b></div>
            </div>
          </div>
        </div>`;
    }).join('');

    grid.querySelectorAll('.card').forEach((card) => {
      card.addEventListener('click', () => card.classList.toggle('flipped'));
    });
  } catch (err) {
    statusChip.textContent = 'OFFLINE';
    statusChip.className = 'status-chip';
  }
}

tick();
setInterval(tick, 2500);
</script>
</body>
</html>
