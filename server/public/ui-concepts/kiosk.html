<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8" />
<title>TimeTaker — Kiosk</title>
<meta name="viewport" content="width=device-width, initial-scale=1" />
<style>
  :root { color-scheme: dark; }
  * { box-sizing: border-box; }
  html, body {
    margin: 0; height: 100%;
    background: #05050a;
    color: #fff;
    font-family: 'Segoe UI', system-ui, sans-serif;
    overflow: hidden;
  }
  .top {
    display: flex; align-items: baseline; justify-content: space-between;
    padding: 28px 48px 10px;
  }
  .top h1 {
    margin: 0; font-size: 2.6vw; letter-spacing: .02em;
    background: linear-gradient(90deg, #ffd93b, #ff6a3d);
    -webkit-background-clip: text; background-clip: text; color: transparent;
  }
  .top .clock { font-size: 1.4vw; color: #99a; font-variant-numeric: tabular-nums; }
  .status { padding: 0 48px 14px; font-size: 1.1vw; color: #7a8; letter-spacing: .08em; text-transform: uppercase; }
  .status.live { color: #4f7; }
  .status.paused { color: #fc5; }
  .status.signup { color: #78f; }
  .board { padding: 0 48px 30px; display: flex; flex-direction: column; gap: 10px; }
  .row {
    display: grid;
    grid-template-columns: 90px 1fr 160px 180px;
    align-items: center;
    background: #11121c;
    border-radius: 16px;
    padding: 14px 28px;
    border: 1px solid #22243a;
    transition: transform .3s ease, background .3s ease;
  }
  .row.p1 { background: linear-gradient(90deg, #4a3600, #1a1a1a); border-color: #ffd93b; }
  .row.p2 { background: linear-gradient(90deg, #2a2a35, #1a1a1a); border-color: #cfd3e6; }
  .row.p3 { background: linear-gradient(90deg, #3a2010, #1a1a1a); border-color: #d08a4a; }
  .rank { font-size: 2.6vw; font-weight: 800; color: #556; text-align: center; }
  .p1 .rank { color: #ffd93b; }
  .p2 .rank { color: #e4e8ff; }
  .p3 .rank { color: #e8a65d; }
  .name { font-size: 2.1vw; font-weight: 700; }
  .heat { display: block; font-size: 1vw; color: #778; font-weight: 400; }
  .rounds { font-size: 2.6vw; font-weight: 800; text-align: right; font-variant-numeric: tabular-nums; }
  .lap { text-align: right; font-size: 1.2vw; color: #99a; font-variant-numeric: tabular-nums; }
  .empty { padding: 80px 48px; text-align: center; font-size: 1.6vw; color: #556; }
  .back { position: fixed; bottom: 16px; right: 20px; font-size: .9vw; }
  .back a { color: #557; text-decoration: none; }
</style>
</head>
<body>
  <div class="top">
    <h1>🏁 TimeTaker — Live Leaderboard</h1>
    <div class="clock" id="clock">--:--:--</div>
  </div>
  <div class="status" id="status">Loading…</div>
  <div class="board" id="board"></div>
  <div class="back"><a href="index.html">← back to UI concepts</a></div>

<script>
const boardEl = document.getElementById('board');
const statusEl = document.getElementById('status');
const clockEl = document.getElementById('clock');

function fmtClock(d) {
  return d.toLocaleTimeString([], { hour: '2-digit', minute: '2-digit', second: '2-digit' });
}
function fmtDuration(ms) {
  if (ms == null) return '—';
  const s = Math.floor(ms / 1000);
  const m = Math.floor(s / 60);
  const rem = s % 60;
  return `${m}:${String(rem).padStart(2, '0')}`;
}

setInterval(() => { clockEl.textContent = fmtClock(new Date()); }, 1000);

async function tick() {
  try {
    const [state, board] = await Promise.all([
      fetch('/api/state').then((r) => r.json()),
      fetch('/api/leaderboard').then((r) => r.json()),
    ]);

    statusEl.textContent = `Status: ${state.status.toUpperCase()}`;
    statusEl.className = 'status ' + (
      state.status === 'started' ? 'live' : state.status === 'signup' ? 'signup' : 'paused'
    );

    if (board.length === 0) {
      boardEl.innerHTML = '<div class="empty">No participants yet. Go sign some up! 🙋</div>';
      return;
    }

    const sorted = [...board].sort((a, b) => b.rounds - a.rounds);
    boardEl.innerHTML = sorted.map((row, i) => {
      const place = i + 1;
      const cls = place === 1 ? 'p1' : place === 2 ? 'p2' : place === 3 ? 'p3' : '';
      return `
        <div class="row ${cls}">
          <div class="rank">${place}</div>
          <div class="name">${escapeHtml(row.name)}<span class="heat">${escapeHtml(row.heatName || '')}</span></div>
          <div class="rounds">${row.rounds} lap${row.rounds === 1 ? '' : 's'}</div>
          <div class="lap">last: ${fmtDuration(row.lastLapDurationMs)}</div>
        </div>`;
    }).join('');
  } catch (err) {
    statusEl.textContent = 'Connection lost — retrying…';
    statusEl.className = 'status paused';
  }
}

function escapeHtml(s) {
  return String(s).replace(/[&<>"']/g, (c) => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]));
}

tick();
setInterval(tick, 2000);
</script>
</body>
</html>
