<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8" />
<title>TimeTaker // TERMINAL</title>
<meta name="viewport" content="width=device-width, initial-scale=1" />
<style>
  * { box-sizing: border-box; }
  html, body {
    margin: 0; min-height: 100%;
    background: #000;
    color: #39ff6a;
    font-family: 'Consolas', 'Courier New', monospace;
    padding: 20px;
  }
  body::before {
    content: '';
    position: fixed; inset: 0; pointer-events: none;
    background: repeating-linear-gradient(
      to bottom, rgba(0,0,0,0) 0, rgba(0,0,0,0) 2px, rgba(0,255,100,.03) 3px
    );
  }
  .crt { text-shadow: 0 0 4px rgba(57,255,106,.6); }
  .ascii { white-space: pre; font-size: .85rem; line-height: 1.1; margin: 0 0 10px; color: #2ad454; }
  .bar { border-top: 1px dashed #1a6e2e; border-bottom: 1px dashed #1a6e2e; padding: 6px 0; margin-bottom: 10px; }
  .prompt { color: #8dffae; }
  table { width: 100%; border-collapse: collapse; font-size: .95rem; }
  th, td { text-align: left; padding: 4px 10px; }
  th { color: #8dffae; border-bottom: 1px solid #1a6e2e; text-transform: uppercase; font-size: .8rem; letter-spacing: .05em; }
  tr.row td { border-bottom: 1px dotted #0e3d1a; }
  tr.row:hover td { background: rgba(57,255,106,.08); }
  .rk { width: 2.5em; color: #ffe066; }
  .rk.top { color: #ffd400; font-weight: bold; }
  .num { text-align: right; font-variant-numeric: tabular-nums; }
  .cursor { display: inline-block; width: 9px; height: 16px; background: #39ff6a; vertical-align: -2px; animation: blink 1s steps(1) infinite; }
  @keyframes blink { 50% { opacity: 0; } }
  .empty { color: #1a6e2e; padding: 30px 0; }
  a { color: #8dffae; }
  .footer { margin-top: 18px; color: #1a6e2e; font-size: .8rem; }
</style>
</head>
<body class="crt">
<pre class="ascii">
 _____ _            _____     _
|_   _(_)_ __  ___  |_   _|_ _| | _____ _ __
  | | | | '  \/ -_)   | |/ _` | |/ / -_) '__|
  |_| |_|_|_|_\___|   |_|\__,_|_|\_\___|_|
</pre>
<div class="bar">
  <span class="prompt">status:</span> <span id="status">connecting...</span><span class="cursor"></span>
  &nbsp;&nbsp;<span class="prompt">clock:</span> <span id="clock">--:--:--</span>
</div>
<table>
  <thead>
    <tr><th class="rk">rk</th><th>callsign</th><th>heat</th><th class="num">laps</th><th class="num">last lap</th></tr>
  </thead>
  <tbody id="rows"></tbody>
</table>
<div id="emptyMsg" class="empty" hidden>&gt; no participants in the system yet_</div>
<div class="footer">&gt; <a href="index.html">cd ../ui-concepts</a></div>

<script>
const rowsEl = document.getElementById('rows');
const statusEl = document.getElementById('status');
const clockEl = document.getElementById('clock');
const emptyEl = document.getElementById('emptyMsg');

function fmtClock(d) {
  return d.toTimeString().slice(0, 8);
}
function fmtDuration(ms) {
  if (ms == null) return '--:--';
  const s = Math.floor(ms / 1000);
  return `${String(Math.floor(s / 60)).padStart(2, '0')}:${String(s % 60).padStart(2, '0')}`;
}
function escapeHtml(s) {
  return String(s).replace(/[&<>"']/g, (c) => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]));
}

setInterval(() => { clockEl.textContent = fmtClock(new Date()); }, 1000);

async function tick() {
  try {
    const [state, board] = await Promise.all([
      fetch('/api/state').then((r) => r.json()),
      fetch('/api/leaderboard').then((r) => r.json()),
    ]);

    statusEl.textContent = `[${state.status.toUpperCase()}]`;

    if (board.length === 0) {
      rowsEl.innerHTML = '';
      emptyEl.hidden = false;
      return;
    }
    emptyEl.hidden = true;

    const sorted = [...board].sort((a, b) => b.rounds - a.rounds);
    rowsEl.innerHTML = sorted.map((row, i) => {
      const place = i + 1;
      return `
        <tr class="row">
          <td class="rk ${place <= 3 ? 'top' : ''}">${String(place).padStart(2, '0')}</td>
          <td>${escapeHtml(row.name)}</td>
          <td>${escapeHtml(row.heatName || '-')}</td>
          <td class="num">${row.rounds}</td>
          <td class="num">${fmtDuration(row.lastLapDurationMs)}</td>
        </tr>`;
    }).join('');
  } catch (err) {
    statusEl.textContent = '[OFFLINE] retrying...';
  }
}

tick();
setInterval(tick, 2000);
</script>
</body>
</html>
